name: resistance

# Run from the repository root:
#   docker compose -f infrastructure/docker-compose.yml up --build
services:
  mysql:
    image: mysql:9
    environment:
      MYSQL_ROOT_PASSWORD: root
    ports:
      - "3306:3306"
    volumes:
      - ./config/db-init:/docker-entrypoint-initdb.d:ro
      - mysql-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-uroot", "-proot"]
      interval: 5s
      timeout: 5s
      retries: 20

  mvc-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/mvc-service
    environment:
      DB_HOST: mysql
      # optional AuditFlow integration (blank = off); see docs/E2E-TEST-PLAN.md
      TRACKER_AUDIT_URL: ${TRACKER_AUDIT_URL:-}
      TRACKER_AUDIT_TOKEN: ${TRACKER_AUDIT_TOKEN:-}
      # optional in-app assistant (blank = feature hidden)
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      # comma-separated emails that get the Admin page (blank = nobody)
      TRACKER_ADMIN_EMAILS: ${TRACKER_ADMIN_EMAILS:-}
    ports:
      - "8085:8085"
    depends_on:
      mysql:
        condition: service_healthy

  intake-service:
    build:
      context: ..
      dockerfile: infrastructure/docker/Dockerfile
      args:
        MODULE: services/intake-service
    environment:
      DB_HOST: mysql
      # optional AuditFlow integration (blank = off); see docs/E2E-TEST-PLAN.md
      TRACKER_AUDIT_URL: ${TRACKER_AUDIT_URL:-}
      TRACKER_AUDIT_TOKEN: ${TRACKER_AUDIT_TOKEN:-}
      # optional Claude fallback for emails the heuristics cannot parse
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
    ports:
      - "8087:8087"
    depends_on:
      mysql:
        condition: service_healthy

volumes:
  mysql-data:
